name: Pathshala-Pro CI/CD Pipeline

on:
  push:
    branches:
      - main
      - master
      - develop
  pull_request:
    branches:
      - main
      - master
      - develop
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-and-test:
    name: Code Quality, Type Safety & Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      DATABASE_URL: "postgresql://dummy:dummy@localhost:5432/pathshala_test?schema=public"
      DIRECT_URL: "postgresql://dummy:dummy@localhost:5432/pathshala_test?schema=public"
      NEXTAUTH_SECRET: "ci-secret-key-pathshala-pro-super-secure-32-chars-long"
      NEXTAUTH_URL: "http://localhost:3000"
      NODE_ENV: "test"

    steps:
      - name: ⬇️ Checkout Repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js (v20)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: 📦 Install Dependencies
        run: npm ci

      - name: 🗄️ Generate Prisma Client
        run: npm run prisma:generate

      - name: 🔍 ESLint Linter Check
        run: npm run lint

      - name: 🧪 Strict TypeScript & Vitest Test Suite
        run: npm run test:all

      - name: 🏗️ Production Next.js Build
        env:
          NODE_ENV: "production"
        run: npm run build
